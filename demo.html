<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo-2</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#4facfe,#00f2fe);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            width:400px;
            background:#fff;
            padding:40px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,.2);
        }

        h1{
            color:#333;
            margin-bottom:15px;
        }

        p{
            color:#666;
            margin-bottom:25px;
        }

        button{
            padding:12px 30px;
            border:none;
            border-radius:8px;
            background:#007bff;
            color:white;
            font-size:18px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#0056b3;
            transform:scale(1.05);
        }

        footer{
            margin-top:25px;
            color:#777;
            font-size:14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to Demo-2</h1>

        <p>
            This is my first GitHub project.
            Created using HTML and CSS.
        </p>

        <button onclick="showMessage()">
            Click Me
        </button>

        <footer>
            Developed by <strong>Pramod Sadekar</strong>
        </footer>
    </div>

    <script>
        function showMessage(){
            alert("Hello! Welcome to my Demo-2 project.");
        }
    </script>

</body>
</html>
